services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: paper
      POSTGRES_DB: paper_terminal
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5433}:5432" # localhost only; 5433 avoids clashing with other local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper_terminal"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
